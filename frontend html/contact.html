
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Code2Chill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="container nav-content">
        <a href="index.html" class="logo">&lt;/&gt; Code<span>2Chill</span></a>
        <a href="index.html" class="nav-btn">Home</a>
    </div>
</header>

<section class="section">
    <div class="container">
        <span class="eyebrow">GET IN TOUCH</span>
        <h2>Let's <span>Connect.</span></h2>
        <p class="section-text">
            Have a question or an idea? We'd love to hear from you.
        </p>

        <form class="join-form" id="contactForm">
            <label>Your Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Your Message</label>
            <textarea name="message" placeholder="Write your message..." required></textarea>

            <button type="submit" class="btn primary" id="contactButton">
                Send Message ↗
            </button>
        </form>

        <p style="margin-top:30px;">
            Instagram:
            <a href="https://www.instagram.com/code2chill.osl/"
               target="_blank" style="color:#a78bfa;">
                @code2chill.osl
            </a>
        </p>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
